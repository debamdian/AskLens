[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "asklens-api"
version = "0.1.0"
description = "AI Data Analyst Platform - FastAPI Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "sqlglot>=25.24.0",
    "google-genai>=0.1.1",
    "httpx>=0.27.2",
    "sse-starlette>=2.1.3",
    "pandas>=2.2.3",
    "numpy>=1.26.4",
    "scipy>=1.14.1",
    "statsmodels>=0.14.3",
    "scikit-learn>=1.5.2",
    "sentence-transformers>=3.1.1",
    "faster-whisper>=1.0.3",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0.2",
    "faker>=30.3.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.9",
    "mypy>=1.11.2"
]
