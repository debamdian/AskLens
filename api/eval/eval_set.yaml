# AskLens Evaluation Set (42 diverse analytical, diagnostic, forecast, and adversarial cases)
cases:
  - id: q01
    category: simple_query
    question: "What is our total completed revenue across all regions?"
    expected_intent: "simple_query"
    reference_sql: "SELECT COALESCE(SUM(total_amount), 0) AS total_revenue FROM warehouse.orders WHERE status = 'completed';"

  - id: q02
    category: simple_query
    question: "How many completed orders do we have in total?"
    expected_intent: "simple_query"
    reference_sql: "SELECT COUNT(*) AS order_count FROM warehouse.orders WHERE status = 'completed';"

  - id: q03
    category: simple_query
    question: "What is the average order value for completed orders?"
    expected_intent: "simple_query"
    reference_sql: "SELECT ROUND(AVG(total_amount), 2) AS avg_order_value FROM warehouse.orders WHERE status = 'completed';"

  - id: q04
    category: simple_query
    question: "Show total revenue by region sorted from highest to lowest."
    expected_intent: "simple_query"
    reference_sql: "SELECT r.name AS region, COALESCE(SUM(o.total_amount), 0) AS revenue FROM warehouse.orders o JOIN warehouse.regions r ON o.region_id = r.region_id WHERE o.status = 'completed' GROUP BY r.name ORDER BY revenue DESC;"

  - id: q05
    category: simple_query
    question: "What are the top 5 revenue-generating product categories?"
    expected_intent: "simple_query"
    reference_sql: "SELECT p.category, COALESCE(SUM(oi.total_price), 0) AS category_revenue FROM warehouse.order_items oi JOIN warehouse.products p ON oi.product_id = p.product_id JOIN warehouse.orders o ON oi.order_id = o.order_id WHERE o.status = 'completed' GROUP BY p.category ORDER BY category_revenue DESC LIMIT 5;"

  - id: q06
    category: simple_query
    question: "List the top 10 products by total units sold."
    expected_intent: "simple_query"
    reference_sql: "SELECT p.name, SUM(oi.quantity) AS units_sold FROM warehouse.order_items oi JOIN warehouse.products p ON oi.product_id = p.product_id GROUP BY p.name ORDER BY units_sold DESC LIMIT 10;"

  - id: q07
    category: simple_query
    question: "How many customers are in each customer segment?"
    expected_intent: "simple_query"
    reference_sql: "SELECT customer_segment, COUNT(*) AS customer_count FROM warehouse.customers GROUP BY customer_segment ORDER BY customer_count DESC;"

  - id: q08
    category: simple_query
    question: "What is the total marketing spend by channel?"
    expected_intent: "simple_query"
    reference_sql: "SELECT channel, COALESCE(SUM(amount), 0) AS total_spend FROM warehouse.marketing_spend GROUP BY channel ORDER BY total_spend DESC;"

  - id: q09
    category: simple_query
    question: "Show monthly revenue for the last 12 months."
    expected_intent: "simple_query"
    reference_sql: "SELECT DATE_TRUNC('month', order_date) AS month, SUM(total_amount) AS revenue FROM warehouse.orders WHERE status = 'completed' GROUP BY 1 ORDER BY 1 DESC LIMIT 12;"

  - id: q10
    category: simple_query
    question: "What is the return count and total refund amount by return reason?"
    expected_intent: "simple_query"
    reference_sql: "SELECT reason, COUNT(*) AS return_count, SUM(refund_amount) AS total_refund FROM warehouse.returns GROUP BY reason ORDER BY return_count DESC;"

  - id: q11
    category: simple_query
    question: "Compare order count by payment method."
    expected_intent: "simple_query"
    reference_sql: "SELECT payment_method, COUNT(*) AS orders FROM warehouse.orders GROUP BY payment_method ORDER BY orders DESC;"

  - id: q12
    category: simple_query
    question: "Which shipping channel has the most orders?"
    expected_intent: "simple_query"
    reference_sql: "SELECT shipping_channel, COUNT(*) AS orders FROM warehouse.orders GROUP BY shipping_channel ORDER BY orders DESC;"

  - id: q13
    category: simple_query
    question: "Show total gross profit by product category."
    expected_intent: "simple_query"
    reference_sql: "SELECT p.category, SUM(oi.total_price - oi.cost_amount) AS gross_profit FROM warehouse.order_items oi JOIN warehouse.products p ON oi.product_id = p.product_id JOIN warehouse.orders o ON oi.order_id = o.order_id WHERE o.status = 'completed' GROUP BY p.category ORDER BY gross_profit DESC;"

  - id: q14
    category: simple_query
    question: "Which 5 products are currently out of stock or low on stock?"
    expected_intent: "simple_query"
    reference_sql: "SELECT name, category, stock_quantity FROM warehouse.products ORDER BY stock_quantity ASC LIMIT 5;"

  - id: q15
    category: simple_query
    question: "Show total orders and revenue in Gujarat."
    expected_intent: "simple_query"
    reference_sql: "SELECT COUNT(o.order_id) AS orders, COALESCE(SUM(o.total_amount), 0) AS revenue FROM warehouse.orders o JOIN warehouse.regions r ON o.region_id = r.region_id WHERE r.name = 'Gujarat' AND o.status = 'completed';"

  - id: q16
    category: simple_query
    question: "Compare return rates between Gujarat and Maharashtra."
    expected_intent: "simple_query"
    reference_sql: "SELECT r.name AS region, COUNT(DISTINCT ret.return_id) AS returns, COUNT(DISTINCT o.order_id) AS orders FROM warehouse.orders o JOIN warehouse.regions r ON o.region_id = r.region_id LEFT JOIN warehouse.returns ret ON o.order_id = ret.order_id WHERE r.name IN ('Gujarat', 'Maharashtra') GROUP BY r.name;"

  - id: q17
    category: simple_query
    question: "What is the marketing ROAS by region?"
    expected_intent: "simple_query"
    reference_sql: "WITH rev AS (SELECT region_id, SUM(total_amount) AS revenue FROM warehouse.orders WHERE status = 'completed' GROUP BY region_id), mkt AS (SELECT region_id, SUM(amount) AS spend FROM warehouse.marketing_spend GROUP BY region_id) SELECT r.name, rev.revenue, mkt.spend, ROUND(rev.revenue / NULLIF(mkt.spend, 0), 2) AS roas FROM warehouse.regions r LEFT JOIN rev ON r.region_id = rev.region_id LEFT JOIN mkt ON r.region_id = mkt.region_id ORDER BY roas DESC;"

  - id: q18
    category: simple_query
    question: "Show monthly marketing spend vs total order revenue."
    expected_intent: "simple_query"
    reference_sql: "WITH rev AS (SELECT DATE_TRUNC('month', order_date)::date AS m, SUM(total_amount) AS revenue FROM warehouse.orders WHERE status = 'completed' GROUP BY 1), mkt AS (SELECT DATE_TRUNC('month', date)::date AS m, SUM(amount) AS spend FROM warehouse.marketing_spend GROUP BY 1) SELECT COALESCE(rev.m, mkt.m) AS month, COALESCE(rev.revenue, 0) AS revenue, COALESCE(mkt.spend, 0) AS spend FROM rev FULL OUTER JOIN mkt ON rev.m = mkt.m ORDER BY 1;"

  - id: q19
    category: simple_query
    question: "How many discontinued products are in our catalog?"
    expected_intent: "simple_query"
    reference_sql: "SELECT COUNT(*) AS discontinued_count FROM warehouse.products WHERE is_discontinued = TRUE;"

  - id: q20
    category: simple_query
    question: "Show average discount amount by customer segment."
    expected_intent: "simple_query"
    reference_sql: "SELECT c.customer_segment, ROUND(AVG(o.discount_amount), 2) AS avg_discount FROM warehouse.orders o JOIN warehouse.customers c ON o.customer_id = c.customer_id GROUP BY c.customer_segment ORDER BY avg_discount DESC;"

  - id: q21
    category: deep_analysis
    question: "Why did sales drop in Gujarat last quarter?"
    expected_intent: "deep_analysis"
    reference_sql: "SELECT DATE_TRUNC('month', o.order_date) AS month, p.category, SUM(o.total_amount) AS revenue FROM warehouse.orders o JOIN warehouse.regions r ON o.region_id = r.region_id JOIN warehouse.order_items oi ON o.order_id = oi.order_id JOIN warehouse.products p ON oi.product_id = p.product_id WHERE r.name = 'Gujarat' AND o.status = 'completed' GROUP BY 1, 2 ORDER BY 1, 2;"

  - id: q22
    category: deep_analysis
    question: "Why did returns spike in Electronics?"
    expected_intent: "deep_analysis"
    reference_sql: "SELECT ret.reason, COUNT(*) AS count FROM warehouse.returns ret JOIN warehouse.order_items oi ON ret.order_item_id = oi.order_item_id JOIN warehouse.products p ON oi.product_id = p.product_id WHERE p.category = 'Electronics' GROUP BY ret.reason ORDER BY count DESC;"

  - id: q23
    category: deep_analysis
    question: "What caused the drop in marketing conversions in West zone?"
    expected_intent: "deep_analysis"
    reference_sql: "SELECT DATE_TRUNC('month', m.date) AS month, m.channel, SUM(m.amount) AS spend, SUM(m.conversions) AS conversions FROM warehouse.marketing_spend m JOIN warehouse.regions r ON m.region_id = r.region_id WHERE r.zone = 'West' GROUP BY 1, 2 ORDER BY 1;"

  - id: q24
    category: deep_analysis
    question: "Analyze the root cause of order cancellations."
    expected_intent: "deep_analysis"
    reference_sql: "SELECT r.name AS region, o.shipping_channel, COUNT(*) AS cancelled_orders FROM warehouse.orders o JOIN warehouse.regions r ON o.region_id = r.region_id WHERE o.status = 'cancelled' GROUP BY 1, 2 ORDER BY cancelled_orders DESC;"

  - id: q25
    category: deep_analysis
    question: "Investigate why average order value decreased in Tier-2 regions."
    expected_intent: "deep_analysis"
    reference_sql: "SELECT DATE_TRUNC('month', o.order_date) AS month, ROUND(AVG(o.total_amount), 2) AS aov FROM warehouse.orders o JOIN warehouse.regions r ON o.region_id = r.region_id WHERE r.tier = 'Tier-2' AND o.status = 'completed' GROUP BY 1 ORDER BY 1;"

  - id: q26
    category: forecast
    question: "Forecast monthly revenue for the next 3 months."
    expected_intent: "forecast"
    reference_sql: "SELECT DATE_TRUNC('month', order_date)::date AS month, SUM(total_amount) AS revenue FROM warehouse.orders WHERE status = 'completed' GROUP BY 1 ORDER BY 1;"

  - id: q27
    category: forecast
    question: "Predict order volume for next quarter."
    expected_intent: "forecast"
    reference_sql: "SELECT DATE_TRUNC('month', order_date)::date AS month, COUNT(*) AS order_count FROM warehouse.orders WHERE status = 'completed' GROUP BY 1 ORDER BY 1;"

  - id: q28
    category: forecast
    question: "Project marketing spend trends for the upcoming 6 months."
    expected_intent: "forecast"
    reference_sql: "SELECT DATE_TRUNC('month', date)::date AS month, SUM(amount) AS spend FROM warehouse.marketing_spend GROUP BY 1 ORDER BY 1;"

  - id: q29
    category: forecast
    question: "What is the expected revenue for Gujarat next month?"
    expected_intent: "forecast"
    reference_sql: "SELECT DATE_TRUNC('month', o.order_date)::date AS month, SUM(o.total_amount) AS revenue FROM warehouse.orders o JOIN warehouse.regions r ON o.region_id = r.region_id WHERE r.name = 'Gujarat' AND o.status = 'completed' GROUP BY 1 ORDER BY 1;"

  - id: q30
    category: forecast
    question: "Forecast return volume for Electronics next quarter."
    expected_intent: "forecast"
    reference_sql: "SELECT DATE_TRUNC('month', ret.return_date)::date AS month, COUNT(*) AS returns FROM warehouse.returns ret JOIN warehouse.order_items oi ON ret.order_item_id = oi.order_item_id JOIN warehouse.products p ON oi.product_id = p.product_id WHERE p.category = 'Electronics' GROUP BY 1 ORDER BY 1;"

