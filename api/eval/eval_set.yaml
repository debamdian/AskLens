  - id: q40
    category: simple_query
    question: "Show total revenue by zone."
    expected_intent: "simple_query"
    reference_sql: "SELECT r.zone, SUM(o.total_amount) AS revenue FROM warehouse.orders o JOIN warehouse.regions r ON o.region_id = r.region_id WHERE o.status = 'completed' GROUP BY r.zone ORDER BY revenue DESC;"

  - id: q41
    category: simple_query
    question: "Which 5 states have the highest number of active customers?"
    expected_intent: "simple_query"
    reference_sql: "SELECT r.name AS state, COUNT(*) AS active_customers FROM warehouse.customers c JOIN warehouse.regions r ON c.region_id = r.region_id WHERE c.is_active = TRUE GROUP BY r.name ORDER BY active_customers DESC LIMIT 5;"

  - id: q42
    category: simple_query
    question: "What is the total shipping fee collected by shipping channel?"
    expected_intent: "simple_query"
    reference_sql: "SELECT shipping_channel, SUM(shipping_fee) AS total_shipping_fee FROM warehouse.orders WHERE status = 'completed' GROUP BY shipping_channel ORDER BY total_shipping_fee DESC;"
