# ==============================================================================
# AskLens: Golden Query Few-Shot Store
# ==============================================================================
golden_queries:
  - id: 1
    category: "Geographic Performance"
    question: "What is the total revenue and order count for each region?"
    sql: |
      SELECT 
          r.name AS region,
          COUNT(DISTINCT o.order_id) AS total_orders,
          COALESCE(SUM(o.total_amount), 0) AS total_revenue
      FROM warehouse.regions r
      LEFT JOIN warehouse.orders o ON r.region_id = o.region_id AND o.status = 'completed'
      GROUP BY r.name
      ORDER BY total_revenue DESC;

  - id: 2
    category: "Diagnostic & Root Cause"
    question: "Why did sales drop in Gujarat last quarter?"
    sql: |
      WITH quarterly_sales AS (
          SELECT 
              DATE_TRUNC('quarter', o.order_date) AS qtr,
              p.category,
              COUNT(o.order_id) AS orders_count,
              SUM(o.total_amount) AS revenue
          FROM warehouse.orders o
          JOIN warehouse.regions r ON o.region_id = r.region_id
          JOIN warehouse.order_items oi ON o.order_id = oi.order_id
          JOIN warehouse.products p ON oi.product_id = p.product_id
          WHERE r.name = 'Gujarat' AND o.status = 'completed'
          GROUP BY 1, 2
      )
      SELECT qtr, category, revenue, orders_count
      FROM quarterly_sales
      ORDER BY qtr DESC, revenue DESC;

  - id: 3
    category: "Product Analytics"
    question: "What are the top 5 product categories by revenue and gross profit?"
    sql: |
      SELECT 
          p.category,
          COUNT(DISTINCT o.order_id) AS total_orders,
          SUM(oi.total_price) AS total_revenue,
          SUM(oi.total_price - oi.cost_amount) AS gross_profit,
          ROUND((SUM(oi.total_price - oi.cost_amount) / NULLIF(SUM(oi.total_price), 0)) * 100, 2) AS profit_margin_pct
      FROM warehouse.order_items oi
      JOIN warehouse.orders o ON oi.order_id = o.order_id
      JOIN warehouse.products p ON oi.product_id = p.product_id
      WHERE o.status = 'completed'
      GROUP BY p.category
      ORDER BY total_revenue DESC
      LIMIT 5;

  - id: 4
    category: "Returns & Quality"
    question: "Which product categories have the highest return rate?"
    sql: |
      SELECT 
          p.category,
          COUNT(DISTINCT oi.order_item_id) AS total_items_sold,
          COUNT(DISTINCT ret.return_id) AS total_returned_items,
          ROUND(COUNT(DISTINCT ret.return_id)::numeric / NULLIF(COUNT(DISTINCT oi.order_item_id), 0) * 100, 2) AS return_rate_pct
      FROM warehouse.products p
      JOIN warehouse.order_items oi ON p.product_id = oi.product_id
      JOIN warehouse.orders o ON oi.order_id = o.order_id
      LEFT JOIN warehouse.returns ret ON oi.order_item_id = ret.order_item_id
      WHERE o.status = 'completed'
      GROUP BY p.category
      ORDER BY return_rate_pct DESC;

  - id: 5
    category: "Marketing Efficiency"
    question: "Compare marketing spend vs completed sales revenue by month"
    sql: |
      WITH monthly_sales AS (
          SELECT 
              DATE_TRUNC('month', order_date)::date AS month,
              SUM(total_amount) AS sales_revenue
          FROM warehouse.orders
          WHERE status = 'completed'
          GROUP BY 1
      ),
      monthly_spend AS (
          SELECT 
              DATE_TRUNC('month', date)::date AS month,
              SUM(amount) AS total_marketing_spend
          FROM warehouse.marketing_spend
          GROUP BY 1
      )
      SELECT 
          s.month,
          s.sales_revenue,
          m.total_marketing_spend,
          ROUND(s.sales_revenue / NULLIF(m.total_marketing_spend, 0), 2) AS roas
      FROM monthly_sales s
      JOIN monthly_spend m ON s.month = m.month
      ORDER BY s.month ASC;
